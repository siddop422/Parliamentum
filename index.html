/* Parliamentum multiplayer bridge: Supabase Auth, cloud saves, rooms, Realtime and secure RPCs. */
(() => {

  };
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const message = value => { const el = $('toast'); if (el) el.textContent = String(value || '').slice(0, 240); };
  const errorText = err => String(err?.message || err || 'Unexpected error').replace(/[\r\n]+/g, ' ').slice(0, 220);
  const online = () => !!(state.client && state.user && !state.offline);
  const ownParty = () => state.roomPlayers.find(p => p.user_id === state.user?.id)?.party || state.profile?.party || 'Independent';
  const gameLocation = () => G?.W?.loc || G?.loc || 'USA';
  const num = (x, fallback=0) => Number.isFinite(Number(x)) ? Number(x) : fallback;

  window.PARL_OFFLINE = false;
  window.PARL_HAS_SAVE = false;
  window.PARL_LOAD = () => {
    if (!state.offline) return false;
    try { const raw = localStorage.getItem('parl1'); if (raw) { G = JSON.parse(raw); G.spd = 0; return true; } }
    catch (_) { message('The offline save could not be read.'); }
    return false;
  };

    if (!pendingSave || !online()) return;
    const game = pendingSave; pendingSave = null;

      const { error } = await state.client.from('saves').upsert({ user_id: state.user.id, game, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
      if (error) throw error;
      window.PARL_HAS_SAVE = true;

  function publicPlayerTag(email, userId) {
    // Keep real email addresses private in public rooms, chat and leaderboards.
    const localPart = String(email || '').split('@')[0];
    const safeName = localPart.normalize('NFKD').replace(/[^a-z0-9_]/gi, '').toLowerCase().slice(0, 12) || 'player';

    return `${safeName}_${suffix}`.slice(0, 20);
  }

  function authErrorMessage(error) {
    const code = String(error?.code || error?.name || '').toLowerCase();
    const raw = String(error?.message || error || 'Unexpected error');
    const msg = raw.toLowerCase();
    if (code === 'over_email_send_rate_limit' || /email rate limit exceeded|over_email_send_rate_limit/.test(msg)) {
      return 'Supabase has temporarily blocked signup emails because this project reached its email-sending limit. Do not keep retrying. The project owner must configure custom SMTP in Supabase, then you can resend the confirmation email.';
    }
    if (code === 'email_address_not_authorized' || /email address not authorized/.test(msg)) {
      return 'Supabase default email delivery only allows approved team addresses. Configure custom SMTP in Supabase to send confirmation emails to normal players.';
    }
    if (/invalid login credentials|invalid_credentials/.test(msg)) {
      return 'Email or password is incorrect. Check both, and make sure you have confirmed your email after registering.';
    }
    if (/email not confirmed|email_not_confirmed/.test(msg)) {
      return 'This email is not confirmed yet. Open the confirmation link sent to your inbox, then sign in again.';
    }
    if (/user already registered|already been registered/.test(msg)) {
      return 'This email already has an account. Switch to Sign in. If it is still unconfirmed, use Resend confirmation after the email service is working.';
    }
    if (/password.*(weak|short)|weak_password/.test(msg)) {
      return 'Choose a stronger password with at least 8 characters.';
    }
    if (/redirect.*(allow|url|not allowed)/.test(msg)) {
      return 'Supabase rejected this site as a confirmation redirect. Add this Vercel site to Authentication → URL Configuration → Redirect URLs.';
    }
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      return 'You appear to be offline. Reconnect to the internet or choose Play offline / solo.';
    }
    return errorText(error);
  }

  function authOverlay() {
    const overlay = document.createElement('div');
    overlay.id = 'parl-auth';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:200;background:#0b0e14ee;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto';
    overlay.innerHTML = `<form id="parl-auth-form" class="pn" style="width:min(390px,100%);padding:18px">
      <h3 style="font-size:18px">Parliamentum — player account</h3>
      <div class="mu" style="margin:6px 0 10px">Use your real email address to register and sign in. Your campaign save follows your account across devices.</div>
      <label for="parl-email">Email address</label><input id="parl-email" type="email" autocomplete="email" inputmode="email" maxlength="254" required placeholder="you@example.com" spellcheck="false" style="width:100%;margin:4px 0 9px">
      <label for="parl-pass">Password</label><input id="parl-pass" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters" style="width:100%;margin:4px 0 10px">
      <button id="parl-auth-submit" type="submit" style="width:100%;padding:9px">Sign in</button>
      <button id="parl-auth-toggle" type="button" style="width:100%;margin-top:5px">Create an account</button>
      <button id="parl-auth-resend" type="button" hidden style="width:100%;margin-top:5px">Resend confirmation email</button>
      <div id="parl-auth-error" role="alert" aria-live="polite" style="color:#e58b81;min-height:34px;margin-top:8px"></div>
      <div id="parl-auth-note" class="mu" style="font-size:12px;margin-top:5px">Your email is used for login and verification. Other players see an automatically generated player tag, not your email. Passwords are handled by Supabase Auth.</div>
      <div style="border-top:1px solid #2a3144;margin-top:12px;padding-top:10px">
        <div class="mu" style="font-size:12px;margin-bottom:5px">Offline solo mode works without Supabase. Offline saves stay on this device.</div>
        <button id="parl-offline" type="button" style="width:100%">Play offline / solo</button>
      </div>
    </form>`;
    document.body.appendChild(overlay);
    let mode = 'signin';
    const form = $('parl-auth-form');
    const toggle = $('parl-auth-toggle');
    const submit = $('parl-auth-submit');
    const emailField = $('parl-email');
    const passwordField = $('parl-pass');
    const resend = $('parl-auth-resend');
    const err = $('parl-auth-error');
    const note = $('parl-auth-note');

    const setMode = nextMode => {
      mode = nextMode;
      submit.textContent = mode === 'signin' ? 'Sign in' : 'Create account';
      toggle.textContent = mode === 'signin' ? 'Create an account' : 'I already have an account';
      passwordField.autocomplete = mode === 'signin' ? 'current-password' : 'new-password';
      resend.hidden = true;
      err.textContent = '';
      note.textContent = mode === 'signup'
        ? 'Enter an email address you can open. Supabase may send a verification link before the account can sign in.'
        : 'Your email is used for login and verification. Other players see an automatically generated player tag, not your email.';
    };

    if (!configured) {
      err.textContent = 'Cloud accounts are not configured. You can still play offline / solo.';
      note.textContent = 'The Supabase project URL or public anon key is missing or invalid in PARLIAMENTUM_CONFIG.';
    }
    toggle.addEventListener('click', () => setMode(mode === 'signin' ? 'signup' : 'signin'));
    $('parl-offline').addEventListener('click', () => {
      state.offline = true; window.PARL_OFFLINE = true; window.PARL_HAS_SAVE = !!localStorage.getItem('parl1');
      overlay.remove(); render();
    });

    resend.addEventListener('click', async () => {
      const email = emailField.value.trim().toLowerCase();
      if (!emailField.checkValidity() || !email) { err.textContent = 'Enter a valid email address first.'; emailField.focus(); return; }
      resend.disabled = true;
      try {
        const { error } = await client.auth.resend({ type: 'signup', email, options: { emailRedirectTo: window.location.origin } });
        if (error) throw error;
        err.style.color = '#78c58b';
        err.textContent = 'A new confirmation email was requested. Check your inbox and spam folder.';
      } catch (e) {
        err.style.color = '#e58b81';
        err.textContent = authErrorMessage(e);
      } finally { resend.disabled = false; }
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      err.style.color = '#e58b81';
      err.textContent = '';
      if (!configured || !client) { err.textContent = 'Cloud login is unavailable. Use offline mode or configure Supabase first.'; return; }
      const email = emailField.value.trim().toLowerCase();
      const password = passwordField.value;
      if (!emailField.checkValidity() || !email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Enter a valid email address, such as you@example.com.'; emailField.focus(); return; }
      if (password.length < 8) { err.textContent = 'Password must be at least 8 characters.'; passwordField.focus(); return; }
      submit.disabled = true; toggle.disabled = true; resend.disabled = true;
      try {
        if (mode === 'signup') {
          const { data, error } = await client.auth.signUp({
            email,
            password,
            options: {
              data: { display_name: publicPlayerTag(email, '') },
              emailRedirectTo: window.location.origin
            }
          });
          if (error) throw error;
          if (!data.session) {
            // Hosted Supabase projects normally require email confirmation.
            // Do not treat this expected response as an authentication failure.
            setMode('signin');
            passwordField.value = '';
            resend.hidden = false;
            err.style.color = '#78c58b';
            err.textContent = `Registration started for ${email}. Confirm the link in your inbox, then sign in here.`;
            note.textContent = 'No confirmation email? Check spam. If Supabase reports an email rate limit, the project owner must configure custom SMTP before another email can be sent.';
            emailField.value = email;
            return;
          }
          state.user = data.user || data.session.user;
        } else {
          const { data, error } = await client.auth.signInWithPassword({ email, password });
          if (error) throw error;
          state.user = data.user || data.session?.user || null;
        }

        if (!state.user?.id) throw new Error('Supabase did not return a signed-in user. Confirm your email and try signing in again.');
        const { data: existing, error: readError } = await client.from('profiles').select('user_id,username,party,colour').eq('user_id', state.user.id).maybeSingle();
        if (readError) throw readError;
        if (existing) {
          state.profile = existing;
        } else {
          const username = publicPlayerTag(email, state.user.id);
          const { data: created, error: createError } = await client.from('profiles').insert({ user_id: state.user.id, username, party: 'Independent', colour: '#38bdf8' }).select('user_id,username,party,colour').single();
          if (createError) throw createError;
          state.profile = created;
        }
        state.offline = false; window.PARL_OFFLINE = false;
        await loadCloudSave();
        passwordField.value = '';
        overlay.remove(); render();
        await resumeRoom();
      } catch (e) {
        state.user = null; state.profile = null;
        try { await client.auth.signOut({ scope:'local' }); } catch (_) {}
        err.style.color = '#e58b81';
        err.textContent = authErrorMessage(e);
        if (/already has an account/i.test(err.textContent)) resend.hidden = false;
      } finally {
        passwordField.value = '';
        submit.disabled = false; toggle.disabled = false; resend.disabled = false;
      }
    });
  }
  async function loadCloudSave() {
    if (!online()) return;
    const { data, error } = await state.client.from('saves').select('game,updated_at').eq('user_id', state.user.id).maybeSingle();
    if (error) throw error;
    window.PARL_HAS_SAVE = !!data?.game;
    if (data?.game && typeof data.game === 'object') { G = data.game; G.spd = 0; render(); }
  }

  async function withError(promise, successMessage) {
    try { const result = await promise; if (result?.error) throw result.error; if (successMessage) message(successMessage); return result?.data; }
    catch (err) { message(errorText(err)); console.error(err); return null; }
  }

  async function createRoom() {
    if (!online()) return message('Sign in to create an online room.');
    const name = ($('mp-room-name')?.value || `${state.profile.username}'s Parliament`).trim();
    const data = await withError(client.rpc('create_room', { p_name: name, p_settings: { game: 'parliamentum', version: 1 } }));
    if (!data) return;
    await enterRoom(data.room_id, data.code, data.name, state.user.id);
    message(`Room created. Share code ${data.code}.`);
  }

  async function joinRoom() {
    if (!online()) return message('Sign in to join an online room.');
    const code = ($('mp-room-code')?.value || '').trim().toUpperCase();
    const role = $('mp-role')?.value || 'mp';
    const party = ($('mp-party')?.value || state.profile.party || 'Independent').trim();
    const data = await withError(client.rpc('join_room', { p_code: code, p_role: role, p_party: party }));
    if (!data) return;
    await enterRoom(data.room_id, data.code, data.name, data.host_id);
  }

  async function resumeRoom() {
    if (!online()) return;
    const { data, error } = await client.from('room_players').select('room_id,role,party,joined_at').eq('user_id', state.user.id).order('joined_at', { ascending: false }).limit(1);
    if (error || !data?.length) return;
    const roomData = await withError(client.from('rooms').select('id,code,name,host_id').eq('id', data[0].room_id).maybeSingle());
    if (roomData) await enterRoom(roomData.id, roomData.code, roomData.name, roomData.host_id);
  }

  async function enterRoom(id, code, name, hostId) {
    if (!online()) return;
    if (state.realtime) { try { await client.removeChannel(state.realtime); } catch (_) {} }
    state.room = { id, code, name, hostId };
    state.isHost = hostId === state.user.id;
    state.messages = []; state.roomPlayers = []; state.bills = []; state.deals = []; state.shared = []; state.muted.clear(); state.seenSharedVersions.clear(); state.resolvingBills.clear();
    await Promise.all([refreshRoomData(), refreshChat()]);
    state.realtime = client.channel(`parliamentum-room-${id}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, payload => {
        const row = payload.new || payload.old;
        if (payload.eventType === 'INSERT' && (row.room_id === id || row.channel === 'global')) {
          if (row.from_id !== state.user.id && !state.muted.has(row.from_id)) state.messages.push(row);
          if (state.messages.length > 100) state.messages.splice(0, state.messages.length - 100);
          updateMultiplayerPanel();
        }
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'room_players', filter: `room_id=eq.${id}` }, refreshRoomData)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'presence', filter: `room_id=eq.${id}` }, refreshRoomData)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'shared_state', filter: `room_id=eq.${id}` }, onSharedState)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bills', filter: `room_id=eq.${id}` }, refreshRoomData)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'player_deals', filter: `room_id=eq.${id}` }, refreshRoomData)
      .subscribe(status => { state.status = status.toLowerCase(); updateMultiplayerPanel(); });
    clearInterval(state.presenceTimer);
    state.presenceTimer = setInterval(publishPresence, 5000);
    clearInterval(state.refreshTimer);
    state.refreshTimer = setInterval(refreshRoomData, 8000);
    await publishPresence();
    render();
  }

  async function refreshRoomData() {
    if (!online() || !state.room) return;
    const id = state.room.id;
    try {
      const [players, presence, profiles, wallets, bills, votes, deals, shared, mutes] = await Promise.all([
        client.from('room_players').select('user_id,role,party,joined_at').eq('room_id', id),
        client.from('presence').select('user_id,location,approval,cash,day,seats,days_pm,updated_at').eq('room_id', id),
        client.from('profiles').select('user_id,username,colour,party').limit(100),
        client.from('player_wallets').select('user_id,balance').eq('room_id', id),
        client.from('bills').select('*').eq('room_id', id).order('created_at', { ascending: false }).limit(30),
        client.from('votes').select('bill_id,user_id,vote').eq('room_id', id),
        client.from('player_deals').select('*').eq('room_id', id).order('created_at', { ascending: false }).limit(30),
        client.from('shared_state').select('key,value,version,updated_at').eq('room_id', id),
        client.from('player_mutes').select('muted_user_id').eq('room_id', id).eq('user_id', state.user.id)
      ]);
      for (const item of [players,presence,profiles,wallets,bills,votes,deals,shared,mutes]) if (item.error) throw item.error;
      const profileMap = new Map((profiles.data || []).map(p => [p.user_id,p]));
      const presenceMap = new Map((presence.data || []).map(p => [p.user_id,p]));
      const walletMap = new Map((wallets.data || []).map(p => [p.user_id,p]));
      state.roomPlayers = (players.data || []).map(p => ({ ...p, profile: profileMap.get(p.user_id) || {}, presence: presenceMap.get(p.user_id) || {}, wallet: walletMap.get(p.user_id) || {} }));
      state.bills = bills.data || []; state.votes = votes.data || []; state.deals = deals.data || []; state.shared = shared.data || [];
      if (G) state.bills.forEach(applyResolvedBill);
      state.muted = new Set((mutes.data || []).map(m => m.muted_user_id));
      // Replay new versioned room state once when joining late; Realtime updates use the same path.
      for (const row of state.shared) if (num(row.version,0) > num(state.seenSharedVersions.get(row.key),0)) await onSharedState({new:row});
      const clock = state.shared.find(x => x.key === 'clock')?.value;
      if (clock && !state.isHost && G) {
        const day = num(clock.day, G.day);
        if (day >= G.day) G.day = day;
        G.spd = clock.paused ? 0 : num(clock.speed, 1);
      }
      updateMultiplayerPanel();
      // A member can resolve any bill at/after the server-published room day. The RPC row-locks and is idempotent.
      const roomDay = num(clock?.day, G?.day || 1);
      for (const bill of state.bills) {
        if (bill.status === 'open' && roomDay >= num(bill.deadline_day, 10000001) && !state.resolvingBills.has(bill.id)) {
          state.resolvingBills.add(bill.id);
          client.rpc('resolve_room_vote', {p_bill_id:bill.id}).then(({error})=>{ if (error) console.warn('Automatic bill resolution:',errorText(error)); }).finally(()=>state.resolvingBills.delete(bill.id));
        }
      }
    } catch (err) { console.warn('Room refresh failed:', errorText(err)); }
  }

  async function refreshChat() {
    if (!online()) return;
    const { data, error } = await client.from('messages').select('id,room_id,channel,from_id,to_id,body,created_at').order('created_at', { ascending: true }).limit(100);
    if (error) { console.warn(errorText(error)); return; }
    state.messages = (data || []).filter(m => !state.muted.has(m.from_id));
    updateMultiplayerPanel();
  }

  async function publishPresence() {
    if (!online() || !state.room || !G) return;
    try {
      const seats = me()?.out ? 0 : (typeof sOf === 'function' ? sOf(me().p) : 0);
      const { error } = await client.rpc('set_presence', {
        p_room_id: state.room.id, p_location: String(gameLocation()).slice(0,80),
        p_approval: Math.max(0, Math.min(100, num(G.eco?.appr,50))),
        p_cash: Math.max(0, Math.min(1000000000000, Math.round(num(G.cash,0)))),
        p_day: Math.max(1, Math.min(10000000, Math.round(num(G.day,1)))),
        p_seats: Math.max(0, Math.min(10000, Math.round(seats))),
        p_days_pm: Math.max(0, Math.min(10000000, Math.round(num(G.daysPM,0))))
      });
      if (error) throw error;
    } catch (err) { console.warn('Presence update failed:', errorText(err)); }
  }

  async function sendChat() {
    if (!online()) return message('Sign in to chat.');
    const input = $('mp-message'); const body = input?.value?.trim();
    if (!body) return;
    const channelName = $('mp-chat-channel')?.value || 'room';
    const toId = channelName === 'dm' ? ($('mp-chat-target')?.value || null) : null;
    if (channelName !== 'global' && !state.room) return message('Join a room to use this channel.');
    const { data, error } = await client.rpc('send_room_message', {
      p_room_id: channelName === 'global' ? null : state.room.id,
      p_channel: channelName, p_to_id: toId, p_body: body.slice(0,300)
    });
    if (error) return message(errorText(error));
    input.value = ''; await refreshChat();
  }

  async function gift() {
    if (!state.room) return message('Join a room first.');
    const to = $('mp-target')?.value; const amount = Math.floor(num($('mp-gift-amount')?.value,0));
    if (!to || amount < 1) return message('Choose a player and gift amount.');
    const result = await withError(client.rpc('send_gift', { p_room_id: state.room.id, p_to_id: to, p_amount: amount }), 'Gift sent from your multiplayer wallet.');
    if (result) await refreshRoomData();
  }

  async function proposeDeal() {
    if (!state.room) return;
    const to = $('mp-target')?.value, kind = $('mp-deal-kind')?.value || 'alliance';
    if (!to) return message('Choose another player.');
    const offer = kind === 'trade' ? Math.max(0,Math.floor(num($('mp-offer-cash')?.value,0))) : 0;
    const request = kind === 'trade' ? Math.max(0,Math.floor(num($('mp-request-cash')?.value,0))) : 0;
    const terms = { note: String($('mp-deal-note')?.value || '').slice(0,300) };
    const result = await withError(client.rpc('propose_player_deal', { p_room_id: state.room.id, p_to_id: to, p_kind: kind, p_offer_cash: offer, p_request_cash: request, p_terms: terms }), 'Deal proposal sent.');
    if (result) await refreshRoomData();
  }

  async function respondDeal(id, accept) {
    const result = await withError(client.rpc('respond_player_deal', { p_deal_id: id, p_accept: accept }), accept ? 'Deal accepted.' : 'Deal declined.');
    if (result) await refreshRoomData();
  }

  async function proposeBill() {
    if (!state.room) return;
    const title = ($('mp-bill-title')?.value || '').trim();
    const deadline = Math.max(1,Math.floor(num(G?.day,1))+Math.max(1,Math.min(30,Math.floor(num($('mp-bill-days')?.value,6)))));
    const effects = { approval: 1 };
    const id = await withError(client.rpc('propose_room_bill', { p_room_id: state.room.id, p_title: title, p_economy: 0, p_social: 0, p_effects: effects, p_deadline_day: deadline }), 'Bill tabled for human voting.');
    if (id) { $('mp-bill-title').value = ''; await refreshRoomData(); }
  }

  async function castVote(id, value) {
    const result = await withError(client.rpc('cast_room_vote', { p_bill_id: id, p_vote: value }), value ? 'Vote recorded: Aye.' : 'Vote recorded: No.');
    if (result !== null) await refreshRoomData();
  }

  async function resolveVote(id) {
    const result = await withError(client.rpc('resolve_room_vote', { p_bill_id: id }), 'Vote resolved by the server.');
    if (result) await refreshRoomData();
  }

  async function shareState(key, value) {
    if (!state.room) return;
    const result = await withError(client.rpc('publish_room_state', { p_room_id: state.room.id, p_key: key, p_value: value }), 'Shared room update published.');
    if (result) await refreshRoomData();
  }

  async function toggleMute(userId) {
    if (!state.room || userId === state.user.id) return;
    const exists = state.muted.has(userId);
    const query = exists
      ? client.from('player_mutes').delete().eq('room_id',state.room.id).eq('user_id',state.user.id).eq('muted_user_id',userId)
      : client.from('player_mutes').insert({ room_id:state.room.id,user_id:state.user.id,muted_user_id:userId });
    const { error } = await query;
    if (error) return message(errorText(error));
    await refreshRoomData(); await refreshChat();
  }

  function applyResolvedBill(bill) {
    if (!G || !bill || bill.status === 'open') return;
    G.mpAppliedBillIds = Array.isArray(G.mpAppliedBillIds) ? G.mpAppliedBillIds : [];
    if (G.mpAppliedBillIds.includes(bill.id)) return;
    G.mpAppliedBillIds.push(bill.id);
    if (G.mpAppliedBillIds.length > 100) G.mpAppliedBillIds.shift();
    if (bill.status === 'passed') {
      const fx = bill.effects || {};
      if (fx.approval) G.eco.appr = cl(G.eco.appr + num(fx.approval), 5, 95);
      if (fx.tax) G.eco.tax = cl(G.eco.tax + num(fx.tax), 15, 50);
      if (fx.services) G.eco.serv = cl(G.eco.serv + num(fx.services), 10, 100);
      if (fx.gdp) G.eco.gdp = cl(G.eco.gdp + num(fx.gdp), -4, 6);
      news(`Shared bill PASSED: ${bill.title}. Effects applied to this campaign.`);
    } else news(`Shared bill REJECTED: ${bill.title}.`);
    save(); render();
  }

  async function onSharedState(payload) {
    const row = payload.new;
    if (!row || row.room_id !== state.room?.id) return;
    const previousVersion = num(state.seenSharedVersions.get(row.key),0);
    if (num(row.version,0) <= previousVersion) return;
    state.seenSharedVersions.set(row.key,num(row.version,0));
    const ix = state.shared.findIndex(x => x.key === row.key);
    if (ix >= 0) state.shared[ix] = row; else state.shared.push(row);
    if (row.key === 'clock' && !state.isHost && G) {
      const c = row.value || {}; G.spd = c.paused ? 0 : num(c.speed,1); G.day = Math.max(G.day,num(c.day,G.day));
    }
    updateMultiplayerPanel();
    const payloadValue = row.value || {};
    if (G && row.key === 'news' && payloadValue.type === 'gift') {
      const sender = state.roomPlayers.find(p=>p.user_id===payloadValue.from_id)?.profile?.username || 'A player';
      const recipient = state.roomPlayers.find(p=>p.user_id===payloadValue.to_id)?.profile?.username || 'another player';
      news(`${sender} sent ${recipient} a $${Math.round(num(payloadValue.amount))} multiplayer wallet gift.`); render();
    } else if (G && row.key === 'bills' && payloadValue.result?.bill_id) {
      const bill = state.bills.find(x=>x.id===payloadValue.result.bill_id);
      if (bill) applyResolvedBill(bill);
    } else if (G && row.key === 'relations' && payloadValue.target_id) {
      G.relations = G.relations || {};
      G.relations[`${payloadValue.actor_id}:${payloadValue.target_id}`] = num(payloadValue.score,0);
      news(`Shared diplomacy: ${String(payloadValue.note || 'A relation changed').slice(0,150)}.`); render();
    } else if (G && row.key === 'sanctions' && payloadValue.target_id) {
      G.sanctions = G.sanctions || [];
      G.sanctions.unshift({ target_id:payloadValue.target_id, active:!!payloadValue.active, note:String(payloadValue.note || '').slice(0,160), day:G.day });
      news(`Shared sanction update: ${String(payloadValue.note || 'Sanctions changed').slice(0,150)}.`); render();
    } else if (G && row.key === 'elections' && payloadValue.from_id !== state.user.id) {
      G.lastElec = payloadValue.election || G.lastElec;
      news(`[Parliament online] ${String(payloadValue.text || 'A room election was published').slice(0,180)}.`); render();
    } else if (G && ['travel','news','actions'].includes(row.key) && payloadValue.text && payloadValue.from_id !== state.user.id) {
      news(`[Parliament online] ${String(payloadValue.text).slice(0,220)}`); render();
    }
  }

  async function publishClock(force=false) {
    if (!online() || !state.room || !state.isHost || !G) return;
    const speed = [0,1,2,4].includes(G.spd) ? G.spd : 0;
    const now = Date.now();
    if (!force && now-state.lastClockAt < 1500 && G.day===state.lastClockDay) return;
    state.lastClockAt = now; state.lastClockDay = G.day;
    const { error } = await client.rpc('set_world_clock', { p_room_id:state.room.id,p_day:Math.max(1,G.day),p_speed:speed,p_paused:speed===0 });
    if (error) console.warn('World clock update failed:',errorText(error));
  }

  async function publishRoomEvent(key, textValue, extra={}) {
    if (!online() || !state.room) return;
    if (key === 'actions') { const now=Date.now(); if (now-state.lastActionAt < 1800) return; state.lastActionAt=now; }
    const value = { text:String(textValue || '').slice(0,300), ...extra, from_id:state.user.id, username:state.profile.username, day:num(G?.day,1), at:new Date().toISOString() };
    await shareState(key,value);
  }

  async function disconnectRoom() {
    clearInterval(state.presenceTimer); clearInterval(state.refreshTimer);
    if (state.realtime && client) { try { await client.removeChannel(state.realtime); } catch (_) {} }
    state.realtime = null; state.room = null; state.roomPlayers = [];
  }
  async function switchOffline() {
    if (G) { try { localStorage.setItem('parl1', JSON.stringify(G)); window.PARL_HAS_SAVE = true; } catch (_) {} }
    state.offline = true; window.PARL_OFFLINE = true;
    await disconnectRoom();
    message('Offline solo mode enabled. Room play is paused; saves stay on this device.');
    render();
  }
  async function logout() {
    await flushSave();
    await disconnectRoom();
    if (client) { try { await client.auth.signOut({ scope:'local' }); } catch (_) {} }
    state.user=null; state.profile=null; state.offline=false;
    location.reload();
  }

  function roomPanel() {
    if (!online()) return `<div class="pn"><h3>Online multiplayer</h3><div class="mu">Sign in with your email and password to create or join rooms. Offline solo mode remains available.</div></div>`;
    const room = state.room;
    const targetOptions = state.roomPlayers.filter(p => p.user_id !== state.user.id).map(p => `<option value="${esc(p.user_id)}">${esc(p.profile.username || 'Player')} · ${esc(p.party)}</option>`).join('');
    const players = state.roomPlayers.map(p => {
      const you = p.user_id === state.user.id, pr = p.presence || {};
      return `<div class="nw"><b style="color:${esc(p.profile.colour || '#c9a24b')}">${esc(p.profile.username || 'Player')}</b>${you?' (you)':''} · ${esc(p.role)} · ${esc(p.party)}<br><span class="mu">📍 ${esc(pr.location || '—')} · approval ${Math.round(num(pr.approval,0))}% · cash $${Math.round(num(pr.cash,0))} · day ${Math.round(num(pr.day,1))} · seats ${Math.round(num(pr.seats,0))} · PM days ${Math.round(num(pr.days_pm,0))}</span>${!you?` <button onclick="MP.mute('${esc(p.user_id)}')">${state.muted.has(p.user_id)?'Unmute':'Mute'}</button>`:''}</div>`;
    }).join('') || '<span class="mu">No players yet.</span>';
    const leaderboard = [...state.roomPlayers].sort((a,b) => num(b.presence?.approval)-num(a.presence?.approval) || num(b.wallet?.balance)-num(a.wallet?.balance)).map((p,i) => `<div class="nw">${i+1}. <b>${esc(p.profile.username || 'Player')}</b> · approval ${Math.round(num(p.presence?.approval))}% · cash $${Math.round(num(p.presence?.cash))} · seats ${Math.round(num(p.presence?.seats))} · PM days ${Math.round(num(p.presence?.days_pm))} · gift wallet $${Math.round(num(p.wallet?.balance))}</div>`).join('') || '<span class="mu">Leaderboard appears once players join.</span>';
    const selectedChannel = state.chatChannel || 'room';
    const messages = state.messages.filter(m => m.channel===selectedChannel && (selectedChannel==='global' || (room && m.room_id===room.id)) && (selectedChannel!=='dm' || m.from_id===state.user.id || m.to_id===state.user.id)).filter(m => !state.muted.has(m.from_id)).slice(-40).map(m => {
      const p = state.roomPlayers.find(x => x.user_id===m.from_id);
      const sender = p?.profile?.username || (m.from_id===state.user.id?state.profile.username:'Player');
      return `<div class="nw"><b>${esc(sender)}</b> <span class="mu">${esc(m.channel)} · ${esc(new Date(m.created_at).toLocaleTimeString())}</span><br>${esc(m.body)}</div>`;
    }).join('') || '<span class="mu">No chat messages.</span>';
    const openBills = state.bills.map(b => {
      const myVote = state.votes.find(v => v.bill_id===b.id && v.user_id===state.user.id);
      const counts = state.votes.filter(v=>v.bill_id===b.id);
      const yes=counts.filter(v=>v.vote).length, no=counts.length-yes;
      const resolved = b.status !== 'open';
      return `<div class="nw"><b>${esc(b.title)}</b> · ${esc(b.status)} · deadline day ${b.deadline_day}<br><span class="mu">Human votes: ${yes} Aye / ${no} No</span>${!resolved?`<br><button onclick="MP.vote('${b.id}',true)" ${myVote?'disabled':''}>Aye</button><button onclick="MP.vote('${b.id}',false)" ${myVote?'disabled':''}>No</button>${G?.day>=b.deadline_day?`<button onclick="MP.resolve('${b.id}')">Resolve at deadline</button>`:''}`:`<div class="mu">Result: ${esc(JSON.stringify(b.result || {}))}</div>`}</div>`;
    }).join('') || '<span class="mu">No shared bills yet.</span>';
    const deals = state.deals.map(d => {
      const incoming = d.to_id===state.user.id;
      const sender = state.roomPlayers.find(p=>p.user_id===(incoming?d.from_id:d.to_id))?.profile?.username || 'Player';
      return `<div class="nw"><b>${esc(d.kind)}</b> with ${esc(sender)} · ${esc(d.status)}${d.kind==='trade'?` · offer $${d.offer_cash}, request $${d.request_cash}`:''}${incoming&&d.status==='pending'?`<br><button onclick="MP.respond('${d.id}',true)">Accept</button><button onclick="MP.respond('${d.id}',false)">Decline</button>`:''}</div>`;
    }).join('') || '<span class="mu">No coalition, alliance or trade proposals.</span>';
    const shared = state.shared.filter(x=>x.key!=='clock').map(x=>`<div class="nw"><b>${esc(x.key)}</b> · v${x.version}<br><span class="mu">${esc(JSON.stringify(x.value).slice(0,380))}</span></div>`).join('') || '<span class="mu">No shared diplomatic events yet.</span>';
    const clock = state.shared.find(x=>x.key==='clock')?.value || {day:G?.day||1,speed:0,paused:true};
    return `<div class="g">
      <div class="pn"><h3>Room lobby</h3><div><b>${esc(room?.name || 'No room joined')}</b></div>${room?`Join code: <b style="color:#c9a24b;letter-spacing:.15em">${esc(room.code)}</b> · ${state.isHost?'Host':'Member'} · Realtime: ${esc(state.status)}<br><button onclick="MP.copyCode()">Copy join code</button><button onclick="MP.leaveRoom()">Leave room</button>`:`<input id="mp-room-name" maxlength="60" placeholder="Room name" style="width:100%;margin:4px 0"><button onclick="MP.createRoom()">Create room</button><hr style="border-color:#2a3144"><input id="mp-room-code" maxlength="6" placeholder="6-character join code" style="width:100%;margin:4px 0"><input id="mp-party" maxlength="60" placeholder="Party" value="${esc(state.profile.party || 'Independent')}" style="width:100%;margin:4px 0"><select id="mp-role"><option value="mp">Member of Parliament</option><option value="leader">Party leader</option></select><button onclick="MP.joinRoom()">Join room</button>`}</div>
      <div class="pn"><h3>Shared world clock</h3>Day ${Math.round(num(clock.day,1))} · ${clock.paused?'Paused':'Running'} · speed ${num(clock.speed,0)}×<br>${state.isHost?`<button onclick="MP.clock(0)">Pause</button><button onclick="MP.clock(1)">1×</button><button onclick="MP.clock(2)">2×</button><button onclick="MP.clock(4)">4×</button>`:'<span class="mu">The host controls pause and speed.</span>'}</div>
      <div class="pn"><h3>Players in this parliament (${state.roomPlayers.length})</h3>${players}</div>
      <div class="pn"><h3>Leaderboard</h3>${leaderboard}<div class="mu">Approval/cash/day/seat figures are reported from each client game; the multiplayer gift wallet is server-authoritative.</div></div>
      <div class="pn"><h3>Chat · Realtime</h3><select id="mp-chat-channel" onchange="MP.chatMode()"><option value="room" ${state.chatChannel==='room'?'selected':''}>Room</option><option value="global" ${state.chatChannel==='global'?'selected':''}>Global</option><option value="party" ${state.chatChannel==='party'?'selected':''}>Party</option><option value="dm" ${state.chatChannel==='dm'?'selected':''}>Private DM</option></select><select id="mp-chat-target" style="${state.chatChannel==='dm'?'':'display:none'}">${targetOptions}</select><div style="height:170px;overflow:auto;margin:5px 0;padding:5px;background:#0e1118;border:1px solid #2a3144;border-radius:4px">${messages}</div><input id="mp-message" maxlength="300" placeholder="Message (300 characters max)" style="width:100%" onkeydown="if(event.key==='Enter')MP.sendChat()"><button onclick="MP.sendChat()">Send</button><div class="mu">HTML is escaped. Chat is limited to 8 messages per minute per player.</div></div>      <div class="pn"><h3>Server-validated gifts and deals</h3><select id="mp-target">${targetOptions}</select><div style="margin:4px 0"><input id="mp-gift-amount" type="number" min="1" max="50000" value="100" style="width:85px"><button onclick="MP.gift()">Send gift</button> <span class="mu">Wallet starts at $300 per room.</span></div><select id="mp-deal-kind"><option value="coalition">Coalition offer</option><option value="alliance">Alliance</option><option value="trade">Trade</option></select><input id="mp-offer-cash" type="number" min="0" max="50000" value="0" placeholder="Offer $" style="width:90px"><input id="mp-request-cash" type="number" min="0" max="50000" value="0" placeholder="Request $" style="width:90px"><input id="mp-deal-note" maxlength="300" placeholder="Deal terms" style="width:100%;margin:4px 0"><button onclick="MP.proposeDeal()">Propose deal</button>${deals}</div>
      <div class="pn"><h3>Human parliamentary voting</h3><input id="mp-bill-title" maxlength="100" placeholder="Bill title" style="width:68%"><input id="mp-bill-days" type="number" min="1" max="30" value="6" style="width:48px"><button onclick="MP.proposeBill()">Table bill</button>${openBills}</div>
      <div class="pn"><h3>Shared diplomacy and news</h3><input id="mp-diplomacy-note" maxlength="250" placeholder="Describe a relation, sanction, election or action" style="width:100%"><label class="mu">Relation score −100 to +100 <input id="mp-rel-score" type="number" min="-100" max="100" value="0" style="width:75px"></label><button onclick="MP.share('relations')">Publish relations</button><button onclick="MP.share('sanctions')">Publish sanctions</button><button onclick="MP.share('lift-sanctions')">Lift sanction</button><button onclick="MP.share('elections')">Publish election</button>${shared}</div>
      <div class="pn"><h3>Account</h3>${esc(state.user.email || 'Signed in')} · ${esc(state.profile.party)}<br><span class="mu">Public player tag: ${esc(state.profile.username)}</span><br><button onclick="MP.offline()">Switch to offline solo</button><button onclick="MP.logout()">Log out</button><div class="mu">Your email is your private login. The public player tag is shown to other players. Sign in again after a new page visit.</div></div>
    </div>`;
  }

  function updateMultiplayerPanel() {
    if (G && G.tab === TABS.length-1) render();
  }
  function T9() { return roomPanel(); }
  TABS.push('Multiplayer'); TV.push(T9);

  // Wrap the original controls without replacing simulation logic.
  const originalSpeed = H.spd;
  H.spd = value => {
    if (state.room && !state.isHost) { message('Only the room host controls the shared clock.'); return; }
    originalSpeed(value);
    publishClock();
  };
  const originalTick = tick;
  tick = function() {
    originalTick();
    if (G && G.gov?.pm === G.mid) G.daysPM = num(G.daysPM,0) + 1;
    if (state.room && state.isHost) publishClock();
    if (state.room) publishPresence();
  };
  const originalGo = H.go;
  H.go = function(country, mode) {
    originalGo(country, mode);
    if (state.room) publishRoomEvent('travel', `${state.profile.username} travelled to ${country}.`, { country, mode });
  };
  const originalSnapElection = H.snapElec;
  H.snapElec = function() {
    originalSnapElection();
    if (state.room && G?.lastElec) publishRoomEvent('elections', `${state.profile.username} triggered an election on day ${G.day}.`, { election:G.lastElec });
  };

  const originalDispatch = D;
  D = function(action, ...args) {
    const result = originalDispatch(action, ...args);
    const quiet = new Set(['tab','sel','spd','day','week','save','load','newg','start','sb','go','snapElec']);
    if (state.room && online() && !quiet.has(action)) publishRoomEvent('actions', `${state.profile.username} performed ${String(action).slice(0,40)}.`, { action:String(action).slice(0,40) });
    return result;
  };

  window.MP = {
    createRoom, joinRoom, logout, offline:switchOffline, gift, proposeDeal, respond:respondDeal, proposeBill, vote:castVote, resolve:resolveVote,
    sendChat, mute:toggleMute,
    copyCode:() => { if (state.room?.code) navigator.clipboard?.writeText(state.room.code).then(()=>message('Room code copied.')).catch(()=>message(state.room.code)); },
    leaveRoom:async () => { if (state.realtime) await client.removeChannel(state.realtime); state.room=null; state.realtime=null; clearInterval(state.presenceTimer); clearInterval(state.refreshTimer); render(); },
    clock:value => { if (!state.room || !state.isHost || !G) return; G.spd=value; publishClock(); render(); },
    share:key => { const note=String($('mp-diplomacy-note')?.value||'').trim(); if (!note) return message('Enter a short description first.');
      if (key==='relations') { const target=$('mp-target')?.value; if (!target) return message('Choose a player for this relation update.'); shareState('relations',{actor_id:state.user.id,target_id:target,score:Math.max(-100,Math.min(100,Math.round(num($('mp-rel-score')?.value,0)))),note}); }
      else if (key==='sanctions' || key==='lift-sanctions') { if (!state.isHost) return message('Only the host can publish room sanctions.'); const target=$('mp-target')?.value; if (!target) return message('Choose a player to sanction or clear.'); shareState('sanctions',{target_id:target,active:key==='sanctions',note}); }
      else if (key==='elections') { if (!state.isHost) return message('Only the host can publish a room election.'); publishRoomEvent('elections',note,{election:G?.lastElec||{day:G?.day||1,note}}); }
    },
    chatMode:() => { state.chatChannel=$('mp-chat-channel')?.value || 'room'; const target=$('mp-chat-target'); if(target) target.style.display=state.chatChannel==='dm'?'':'none'; render(); },
  };

  // Every page load starts unauthenticated because persistSession:false; no password is retained.
  authOverlay();
})();

</script></body></html>
